title: Joseph Resch
email: jresch@ucla.edu
tagline: Statistician & Data Scientist
description: >-
  Statistics Ph.D. from UCLA with a background in economics. Experienced in Bayesian modeling, causal inference, experimentation, and machine learning.
baseurl: ""
url: "https://josephresch.github.io"
github_username: josephresch
linkedin_username: joseph-resch
theme: minima
plugins:
  - jekyll-sitemap
header_pages: []

# Jekyll's own defaults, which listing `exclude` at all would otherwise
# replace, plus the build scripts, which are repo tooling and not web content.
exclude:
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/
  - tools/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  # Social-share card for any page that doesn't set its own `image`.
  # Project pages declare their own figure in front matter and override this.
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-card.png
        width: 1200
        height: 630
        alt: "Joseph Resch — Statistician and Data Scientist. Bayesian modeling, causal inference, experimentation, machine learning. Statistics Ph.D., UCLA."
  - scope:
      path: ""
      type: projects
    values:
      layout: project
